<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Rowspan Colspan</title>
</head>
<body>
    <h1>Student Result</h1>
    <table border="5" cellpadding="10">
            <tr>
                <th colspan="3">Student Details</th>
            </tr>
            <tr>
                <th>name</th>
                <th>subject</th>
                <th>marks</th>
            </tr>
            <tr>
                <td rowspan="2">Dwij</td>
                <td>Urdu</td>
                <td>69.69</td>
            </tr>
            <tr>
                <td>Sanskrit</td>
                <td>69.69</td>
            </tr>
    </table>
</body>
</html>
