<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightgray;
            text-align: center;
            padding-top: 200px;
        }

        .login {
            background-color: white;
            padding: 30px;
            width: 700px;
            margin: auto;
            border-radius: 10px;
        }

        input {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: blue;
            color: white;
            border: none;
        }
    </style>
</head>

<body>

    <div class="login">

        <h2>Login</h2>

        <form>
            <input type="text" placeholder="Username">

            <input type="password" placeholder="Password">

            <button type="submit">Login</button>
        </form>

    </div>

</body>
</html>
